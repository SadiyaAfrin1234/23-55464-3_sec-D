<!DOCTYPE HTML>
<HEAD>
<title>lab task</title>
<link rel = "Stylesheet" href = "style.css.css"
</HEAD>
<BODY>
<FORM>
<label for = "fullname">Fullname:</label>
<input type = "text" name = "fullname" id = "fullname" required>

<br><br>
<label for = "password">password:</label>
<input type = "password" name = "password" id = "password">
<br><br>

<br><br>
<label for = "dob">Date of birth:</label>
<input type = "Date" name = "dob" id = "dob">
<br><br>

<br><br>
<label for = "image"> Choose your photo:</label>
<input type = "file" name = "photo" id = "photo">
<br><br>

<br><br>
<label for = "gender">Gender:</label>
<input type = "radio" name = "gender" id = "gender" value = "Male">Male
<input type = "radio" name = "gender" id = "gender" value = "female">Female
<br><br>

<br><br>
<label for = "religion"> Religion:</label>
<input type = "checkbox" name = "r1" id = "r1" value = "islam" checked> Islam
<input type = "checkbox" name = "r3" id = "r3" value = "Hindu">Hindu
<br><br>

<div>
<label for = "department"> Department:</label>
<Select name = "department">
<Option value = "CSE" Selected>CSE</option>
<option value = "EEE">EEE</option>
</Select>
</div>

<div>
<label for = "Address"> write down the address:</label>
<textarea rows = "5"></textarea>
</div>

<div>
<input type = "Submit" value = "register">
<input type = "reset" value = "clear" disabled>
</div>

</FORM>
</BODY>
</HTML>
